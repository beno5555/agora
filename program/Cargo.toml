[workspace]
members = ["programs/*"]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

# No debug symbols for host builds (tests): Windows Defender locks the .pdb
# files while scanning them, which breaks linking.
[profile.dev]
debug = false
